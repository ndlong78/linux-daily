# PR83 synchronize trigger; workflow restores release.yml from main before verification.
name: PR83 Finalize via Release Policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  finalize-pr83:
    if: github.head_ref == 'chatgpt/pr83-backfill-034-040-20260803-0809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr83-backfill-034-040-20260803-0809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Regenerate deterministic repository state
        run: |
          python tools/backfill_site_metadata.py
          python tools/backfill_fonts.py
          python tools/taxonomy.py
          python tools/related_content.py
          python tools/build.py
          python tools/distro_coverage.py
          python tools/quality_dashboard.py
          python tools/learning_dashboard.py
          python tools/content_mix.py
      - name: Restore release policy before verification
        run: git checkout origin/main -- .github/workflows/release.yml
      - name: Verify exact final workspace
        run: |
          python tools/backfill_site_metadata.py --check
          python tools/backfill_fonts.py --check
          python tools/related_content.py --check
          python tools/build.py --check
          python tools/validate_repo.py
          pytest -q
      - name: Commit verified result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Linux Daily #034-#040 publication backfill'
          git push origin HEAD:chatgpt/pr83-backfill-034-040-20260803-0809
