name: Temporary STYLE Backfill D
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr89-style-backfill-031-040
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply once
        run: |
          if grep -q '"tested_on"' posts/post-031-mount-options-filesystem-protection.html; then
            echo "Batch D already migrated"
            exit 0
          fi
          python3 tools/_tmp_style_backfill_d.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/post-*.html
          git commit -m "style(posts): apply Batch D migration"
          git push origin HEAD:chatgpt/pr89-style-backfill-031-040
