name: PR38 Social Preview Backfill

on:
  push:
    branches: [chatgpt/pr38-social-preview-metadata]

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr38-social-preview-metadata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -e ".[dev]"
      - name: Build social preview metadata
        run: python tools/build.py
      - name: Commit generated HTML
        run: |
          # One-shot branch-only backfill; workflow is removed before PR review.
          if git diff --quiet -- index.html posts/post-*.html; then
            echo 'No generated HTML changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html posts/post-*.html
          git commit -m 'PR #38: backfill social preview metadata'
          git push origin HEAD:chatgpt/pr38-social-preview-metadata
