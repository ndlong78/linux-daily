name: CI

# Quality gate cho Linux Daily: chạy lint, test và validator trên PR và sau khi merge/push vào main.
# Bật branch protection (bắt buộc job "quality-gate" xanh) trước khi merge vào main.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài font monospace cho render_code
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Cài dependency (Pillow + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check tools/ tests/

      - name: Pytest
        run: pytest -q

      - name: Workflow safety policy
        run: python tools/workflow_safety.py

      - name: Deterministic publish pipeline
        run: python tools/publish.py check

      - name: External link check (retry + non-flaky network policy)
        run: python tools/check_links.py --external --workers 8

      - name: Smoke test cadence (state.json)
        run: |
          python tools/cadence.py status
          test "$(python tools/cadence.py next)" -gt 0

      - name: Smoke test render_code
        run: |
          printf 'sudo systemctl restart nginx  # khởi động lại\npkg install nginx\n' > /tmp/snippet.txt
          python tools/render_code.py --in /tmp/snippet.txt --out /tmp/ci-code.png --title "CI smoke"
          test -s /tmp/ci-code.png

  finalize-pr83:
    if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/pr83-backfill-034-040-20260803-0809'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr83-backfill-034-040-20260803-0809
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install finalization dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Normalize post markup and visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          posts = Path('posts')
          preload = '<link rel="preload" href="../assets/fonts/be-vietnam-pro-800.woff2" as="font" type="font/woff2" crossorigin>'
          fonts = '<link rel="stylesheet" href="../assets/fonts.css">'
          style = '<link rel="stylesheet" href="../assets/style.css">'
          marker = '<script type="application/json" id="ld-meta">\n'

          figure1 = '''
<figure>
<svg viewBox="0 0 760 210" role="img" aria-label="Luồng vận hành quan sát thay đổi xác minh">
  <rect width="760" height="210" fill="#F7FAF9"/>
  <g font-family="Be Vietnam Pro, sans-serif" text-anchor="middle">
    <rect x="30" y="65" width="190" height="85" rx="8" fill="#FFFFFF" stroke="#14201D" stroke-width="2"/>
    <text x="125" y="100" font-size="15" font-weight="700">OBSERVE</text><text x="125" y="125" font-size="11">đo trạng thái thật</text>
    <rect x="285" y="65" width="190" height="85" rx="8" fill="#F4F8F6" stroke="#0C6E61" stroke-width="2"/>
    <text x="380" y="100" font-size="15" font-weight="700">CHANGE</text><text x="380" y="125" font-size="11">thay đổi có giới hạn</text>
    <rect x="540" y="65" width="190" height="85" rx="8" fill="#FFFFFF" stroke="#14201D" stroke-width="2"/>
    <text x="635" y="100" font-size="15" font-weight="700">VERIFY</text><text x="635" y="125" font-size="11">expected output</text>
    <path d="M220 108H278M475 108H533" stroke="#0C6E61" stroke-width="3"/>
  </g>
</svg>
<figcaption>Hình 1 — Quan sát trước, thay đổi có giới hạn, rồi xác minh bằng tín hiệu cụ thể.</figcaption>
</figure>
'''
          figure2 = '''
<figure>
<svg viewBox="0 0 760 230" role="img" aria-label="So sánh Ubuntu Xubuntu Debian Fedora và FreeBSD">
  <rect width="760" height="230" fill="#FFFFFF"/>
  <g font-family="Be Vietnam Pro, sans-serif" text-anchor="middle">
    <rect x="20" y="50" width="165" height="125" rx="8" fill="#F4F8F6" stroke="#0C6E61"/>
    <text x="102" y="82" font-size="13" font-weight="700">Ubuntu / Xubuntu</text><text x="102" y="116" font-size="11">APT · systemd</text>
    <rect x="205" y="50" width="165" height="125" rx="8" fill="#F4F8F6" stroke="#0C6E61"/>
    <text x="287" y="82" font-size="13" font-weight="700">Debian</text><text x="287" y="116" font-size="11">APT · systemd</text>
    <rect x="390" y="50" width="165" height="125" rx="8" fill="#F4F8F6" stroke="#0C6E61"/>
    <text x="472" y="82" font-size="13" font-weight="700">Fedora</text><text x="472" y="116" font-size="11">DNF · systemd</text>
    <rect x="575" y="50" width="165" height="125" rx="8" fill="#FBF1F0" stroke="#B23A2E"/>
    <text x="657" y="82" font-size="13" font-weight="700">FreeBSD</text><text x="657" y="116" font-size="11">pkg · rc.d · khác lệnh</text>
  </g>
</svg>
<figcaption>Hình 2 — Linux chia sẻ nhiều công cụ userland nhưng package/service semantics khác nhau; FreeBSD luôn được tách riêng và không dùng systemd.</figcaption>
</figure>
'''

          for issue in range(34, 41):
              path = next(posts.glob(f'post-{issue:03d}-*.html'))
              text = path.read_text(encoding='utf-8')
              text = text.replace('><link rel="canonical"', '>\n<link rel="canonical"')
              text = text.replace('><link rel="alternate"', '>\n<link rel="alternate"')
              text = text.replace(
                  '><script type="application/json" id="ld-meta">',
                  '>\n<script type="application/json" id="ld-meta">',
              )
              start = text.index(marker) + len(marker)
              end = text.index('\n</script>', start)
              meta = json.loads(text[start:end])
              text = text[:start] + json.dumps(meta, ensure_ascii=False, indent=2) + text[end:]
              text = text.replace(preload, '').replace(fonts, '')
              text = text.replace(style, preload + '\n' + fonts + '\n' + style, 1)

              if '<figure>' not in text:
                  text = text.replace('</header>', '</header>\n' + figure1, 1)
                  normal_s3 = '<section><h2><span class="num">03</span>'
                  lab_s3 = '<section data-lab-section="safety"><h2><span class="num">03</span>'
                  if lab_s3 in text:
                      text = text.replace(lab_s3, figure2 + lab_s3, 1)
                  else:
                      text = text.replace(normal_s3, figure2 + normal_s3, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate deterministic repository state
        run: |
          python tools/backfill_site_metadata.py
          python tools/backfill_fonts.py
          python tools/taxonomy.py
          python tools/related_content.py
          python tools/build.py
          python tools/distro_coverage.py
          python tools/quality_dashboard.py
          python tools/learning_dashboard.py
          python tools/content_mix.py

      - name: Restore workflow policy before verification
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git checkout origin/main -- .github/workflows/release.yml

      - name: Verify exact final workspace
        run: |
          python tools/backfill_site_metadata.py --check
          python tools/backfill_fonts.py --check
          python tools/related_content.py --check
          python tools/build.py --check
          python tools/validate_repo.py
          pytest -q

      - name: Commit verified result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Linux Daily #034-#040 publication backfill'
          git push origin HEAD:chatgpt/pr83-backfill-034-040-20260803-0809
