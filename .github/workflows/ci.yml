name: CI

# Quality gate cho Linux Daily: chạy lint, test và validator trên mọi PR + push.
# Bật branch protection (bắt buộc job "quality-gate" xanh) trước khi merge vào main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # cho phép chạy tay từ tab Actions (hữu ích khi vừa bật Actions)

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài font monospace cho render_code
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Cài dependency (Pillow + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check tools/ tests/

      - name: Pytest
        run: pytest -q

      - name: Build + quality gate (index, meta, sources, internal links)
        run: python tools/build.py --check

      - name: Release metadata consistency
        run: python tools/release.py validate

      - name: Repository health summary
        run: python tools/repo_health.py

      - name: External link check (retry + non-flaky network policy)
        run: python tools/check_links.py --external --workers 8

      - name: Smoke test cadence (state.json)
        run: |
          python tools/cadence.py status
          test "$(python tools/cadence.py next)" -gt 0

      - name: Smoke test render_code
        run: |
          printf 'sudo systemctl restart nginx  # khởi động lại\npkg install nginx\n' > /tmp/snippet.txt
          python tools/render_code.py --in /tmp/snippet.txt --out /tmp/ci-code.png --title "CI smoke"
          test -s /tmp/ci-code.png
