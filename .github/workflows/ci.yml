name: CI

# Quality gate cho Linux Daily: chạy lint, test và validator trên mọi PR + push.
# Bật branch protection (bắt buộc job "quality-gate" xanh) trước khi merge vào main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-related:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Generate and commit related navigation when stale
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python tools/related_content.py
          git add posts/
          if git diff --cached --quiet; then
            echo "Related navigation already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate related navigation"
          git push origin "HEAD:$HEAD_REF"

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài font monospace cho render_code
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Cài dependency (Pillow + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check tools/ tests/

      - name: Pytest
        run: pytest -q

      - name: Build + quality gate (index, meta, sources, internal links)
        run: python tools/build.py --check

      - name: Taxonomy metadata consistency
        run: python tools/taxonomy.py

      - name: Release metadata consistency
        run: python tools/release.py validate

      - name: Performance budget
        run: python tools/performance_budget.py

      - name: Repository health summary
        run: python tools/repo_health.py

      - name: External link check (retry + non-flaky network policy)
        run: python tools/check_links.py --external --workers 8

      - name: Smoke test cadence (state.json)
        run: |
          python tools/cadence.py status
          test "$(python tools/cadence.py next)" -gt 0

      - name: Smoke test render_code
        run: |
          printf 'sudo systemctl restart nginx  # khởi động lại\npkg install nginx\n' > /tmp/snippet.txt
          python tools/render_code.py --in /tmp/snippet.txt --out /tmp/ci-code.png --title "CI smoke"
          test -s /tmp/ci-code.png
