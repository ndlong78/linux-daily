name: CI

# Quality gate cho Linux Daily: chạy lint, test và validator trên PR và sau khi merge/push vào main.
# Bật branch protection (bắt buộc job "quality-gate" xanh) trước khi merge vào main.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Gom theo số PR để commit mới huỷ CI của commit cũ trên cùng PR — trong các đợt
# sửa lỗi liên tiếp, phần lớn run cũ đã vô nghĩa trước khi chạy xong.
#
# Push vào main thì gom theo `github.sha`, mỗi commit một nhóm riêng, và
# cancel-in-progress tắt. Đây là điều kiện bắt buộc, không phải tuỳ chọn:
# `tools/release.py` (WORKFLOWS) đòi CI và Production Smoke xanh trên ĐÚNG SHA
# của main. Nếu commit sau huỷ CI của commit trước thì SHA đó vĩnh viễn không có
# CI xanh và không release được từ nó nữa.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache kết quả link check GIỮA các run, không commit vào git — artifact
      # thay đổi mỗi ngày mà commit lại thì phình lịch sử, đúng thứ đang làm
      # .git nặng lên. Key theo nội dung bài: thêm bài thì key đổi, nhưng
      # restore-keys cho lấy lại cache gần nhất rồi bổ sung phần mới.
      - name: Cache link check
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: .link-cache.json
          key: link-cache-${{ hashFiles('posts/post-*.html') }}
          restore-keys: link-cache-

      - name: PR commit/path hygiene
        if: github.event_name == 'pull_request'
        run: >-
          python tools/pr_hygiene.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Cài dependency (Pillow + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check tools/ tests/

      - name: Pytest
        run: pytest -q

      - name: Workflow safety policy
        run: python tools/workflow_safety.py

      - name: STYLE.md contract
        run: python tools/validate_style.py

      - name: Deterministic publish pipeline
        run: python tools/publish.py check

      # Cache CHỈ dùng trên PR. Trên push:main và lịch định kỳ thì không, để mọi
      # URL được hỏi lại thật — đó là chỗ phát hiện link mục, và cache ở đó sẽ
      # làm chậm việc phát hiện mà không đổi lại được gì.
      #
      # Trên PR, chỉ link MỚI do nhánh đưa vào mới chặn merge. Link đã có sẵn trên
      # base mà hôm nay 404 là nợ bảo trì của kho — chặn bài hằng ngày vì nó là
      # sai đối tượng. Trên push/main và lịch định kỳ thì không truyền --baseline,
      # nên mọi link chết đều chặn: ở đó không có bài nào để chặn nên siết là đúng.
      - name: External link check (retry + non-flaky network policy)
        run: >-
          python tools/check_links.py --external --workers 8
          ${{ github.event_name == 'pull_request'
              && format('--baseline {0} --cache .link-cache.json',
                        github.event.pull_request.base.sha)
              || '' }}

      - name: Smoke test cadence (state.json)
        run: |
          python tools/cadence.py status
          test "$(python tools/cadence.py next)" -gt 0

      - name: Smoke test render_code
        run: |
          printf 'sudo systemctl restart nginx  # khởi động lại\npkg install nginx\n' > /tmp/snippet.txt
          python tools/render_code.py --in /tmp/snippet.txt --out /tmp/ci-code.png --title "CI smoke"
          test -s /tmp/ci-code.png
