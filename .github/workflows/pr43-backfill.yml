name: PR43 One-shot Font Backfill

on:
  push:
    branches: [chatgpt/pr43-complete-self-host-fonts]

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr43-complete-self-host-fonts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build generated HTML with local fonts
        run: |
          test -f .github/pr43-backfill.marker
          pip install -e ".[dev]"
          python tools/build.py
      - name: Commit generated site and disarm marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr43-backfill.marker
          git add index.html posts
          git commit -m 'PR #43: backfill self-hosted fonts across site'
          git push origin HEAD:chatgpt/pr43-complete-self-host-fonts
