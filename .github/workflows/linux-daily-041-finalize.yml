name: Temporary Linux Daily 041 Finalize

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'chatgpt/linux-daily-041-20260810' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/linux-daily-041-20260810

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate deterministic artifacts to fixed point
        run: |
          python tools/publish.py prepare
          python tools/publish.py prepare

      - name: Remove one-shot marker before validation
        run: rm -f .linux-daily-041-finalize

      - name: Validate complete publish pipeline
        run: python tools/publish.py check

      - name: Commit deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -d '' files < <(git diff --name-only -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git add -- "${files[@]}"
          git commit -m "Linux Daily #041: regenerate deterministic artifacts"
          git push origin HEAD:chatgpt/linux-daily-041-20260810
