name: PR69 Refresh derived reports

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 69
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr69-p9-3-storage-backup-restore-advanced-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Refresh canonical derived reports
        run: |
          rm .github/workflows/pr69-refresh-reports.yml
          python tools/content_mix.py
          python tools/distro_coverage.py
          python tools/learning_dashboard.py
          python tools/quality_dashboard.py
      - name: Commit refreshed snapshots and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh issue 21 derived quality snapshots"
          git push
