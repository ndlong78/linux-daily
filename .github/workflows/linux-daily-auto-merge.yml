name: Linux Daily Auto Merge

# Chỉ merge PR bài hằng ngày sau khi workflow CI của đúng head SHA đã thành công.
# Workflow này chạy từ default branch qua workflow_run, không checkout code của PR
# và không sửa/commit/push ngược feature branch.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: read

jobs:
  squash-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    concurrency:
      group: linux-daily-auto-merge-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate exact PR contract
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          author="$(jq -r '.user.login' <<<"${pr_json}")"

          test "${state}" = "open"
          test "${draft}" = "false"
          test "${base_ref}" = "main"
          test "${head_repo}" = "${GITHUB_REPOSITORY}"
          test "${author}" = "${GITHUB_REPOSITORY_OWNER}"
          [[ "${head_ref}" =~ ^chatgpt/linux-daily-[0-9]{3}-[0-9]{8}$ ]]
          test "${head_sha}" = "${CI_HEAD_SHA}"

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          review_json="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewDecision reviewThreads(first:100){nodes{isResolved}}}}}' \
            -F owner="${owner}" \
            -F repo="${repo}" \
            -F pr="${PR_NUMBER}")"

          review_decision="$(jq -r '.data.repository.pullRequest.reviewDecision // ""' <<<"${review_json}")"
          unresolved_threads="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"${review_json}")"

          test "${review_decision}" != "CHANGES_REQUESTED"
          test "${unresolved_threads}" = "0"

          echo "Validated PR #${PR_NUMBER}: ${head_ref} @ ${head_sha}"

      - name: Squash merge exact CI head
        shell: bash
        run: |
          set -euo pipefail

          response="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="${CI_HEAD_SHA}")"

          merged="$(jq -r '.merged' <<<"${response}")"
          message="$(jq -r '.message // ""' <<<"${response}")"

          if test "${merged}" != "true"; then
            echo "Auto-merge refused: ${message}" >&2
            exit 1
          fi

          echo "Squash-merged PR #${PR_NUMBER} after exact-head CI success."
