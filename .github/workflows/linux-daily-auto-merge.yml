name: Linux Daily Auto Merge

# Chỉ merge PR bài hằng ngày sau khi workflow CI của đúng head SHA đã thành công.
# Workflow này chạy từ default branch qua workflow_run, không checkout code của PR
# và không sửa/commit/push ngược feature branch.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: read
  # Cần cho bước dispatch xác thực sau merge ở cuối job. Không nới thêm gì khác:
  # tools/workflow_safety.py cấm mọi quyền ghi ngoài ba dòng này.
  actions: write

jobs:
  squash-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    concurrency:
      # Serialize toàn bộ merge vào main. Nhóm theo PR vẫn cho hai PR khác nhau
      # merge đồng thời và làm SHA dùng cho post-merge validation bị nhập nhằng.
      group: linux-daily-auto-merge-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate exact PR contract
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          author="$(jq -r '.user.login' <<<"${pr_json}")"

          test "${state}" = "open"
          test "${draft}" = "false"
          test "${base_ref}" = "main"
          test "${head_repo}" = "${GITHUB_REPOSITORY}"
          test "${author}" = "${GITHUB_REPOSITORY_OWNER}"
          [[ "${head_ref}" =~ ^chatgpt/linux-daily-[0-9]{3}-[0-9]{8}$ ]]
          test "${head_sha}" = "${CI_HEAD_SHA}"

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          # Đọc hết review threads thay vì chỉ tin trang đầu 100 phần tử. Nếu API
          # trả pageInfo không hợp lệ hoặc cursor không tiến triển, fail closed để
          # workflow có quyền ghi không thể merge khi trạng thái review chưa rõ.
          cursor="null"
          previous_cursor=""
          unresolved_threads=0
          review_decision=""
          while true; do
            review_json="$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$pr:Int!,$cursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewDecision reviewThreads(first:100,after:$cursor){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}' \
              -F owner="${owner}" \
              -F repo="${repo}" \
              -F pr="${PR_NUMBER}" \
              -F cursor="${cursor}")"

            test "$(jq -r '.data.repository.pullRequest != null' <<<"${review_json}")" = "true"
            review_decision="$(jq -r '.data.repository.pullRequest.reviewDecision // ""' <<<"${review_json}")"
            page_unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"${review_json}")"
            has_next_page="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"${review_json}")"
            end_cursor="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // ""' <<<"${review_json}")"
            [[ "${page_unresolved}" =~ ^[0-9]+$ ]]
            unresolved_threads="$(( unresolved_threads + page_unresolved ))"

            if test "${has_next_page}" = "false"; then
              break
            fi
            test "${has_next_page}" = "true"
            test -n "${end_cursor}"
            test "${end_cursor}" != "${previous_cursor}"
            previous_cursor="${end_cursor}"
            cursor="${end_cursor}"
          done

          test "${review_decision}" != "CHANGES_REQUESTED"
          test "${unresolved_threads}" = "0"

          echo "Validated PR #${PR_NUMBER}: ${head_ref} @ ${head_sha}"

      - name: Squash merge exact CI head
        id: squash_merge
        shell: bash
        run: |
          set -euo pipefail

          response="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="${CI_HEAD_SHA}")"

          merged="$(jq -r '.merged' <<<"${response}")"
          merged_sha="$(jq -r '.sha // ""' <<<"${response}")"
          message="$(jq -r '.message // ""' <<<"${response}")"

          if test "${merged}" != "true" || ! [[ "${merged_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Auto-merge refused: ${message}" >&2
            exit 1
          fi

          echo "merged_sha=${merged_sha}" >> "${GITHUB_OUTPUT}"
          echo "Squash-merged PR #${PR_NUMBER} thành ${merged_sha} sau exact-head CI success."

      - name: Dispatch post-merge validation on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ steps.squash_merge.outputs.merged_sha }}
        run: |
          set -euo pipefail

          # Sự kiện sinh bởi GITHUB_TOKEN không tạo workflow run mới. Squash-merge
          # ở bước trên vì thế KHÔNG kích `on: push` của ci.yml lẫn
          # production-smoke.yml — đo được trên 4/4 commit auto-merge, trong khi
          # mọi commit merge tay đều có run push.
          #
          # Hậu quả: commit bài hằng ngày không có CI trên main, nên
          # `tools/release.py` (WORKFLOWS = CI + Production Smoke, đòi xanh trên
          # ĐÚNG SHA của main) không bao giờ thoả — không release được từ bài nào.
          #
          # workflow_dispatch là ngoại lệ gọi được bằng GITHUB_TOKEN, nhưng ta
          # KHÔNG tin vào giả định đó: endpoint dispatch trả 204 kể cả khi không
          # có gì chạy. Thiếu bước xác nhận thì đây là hỏng im lặng đúng nghĩa —
          # workflow xanh, release vẫn hỏng, không ai biết cho tới lúc cắt tag.
          #
          # Bước này fail thì PR ĐÃ merge rồi; đó là chủ ý. Không undo merge —
          # chỉ báo đỏ để biết SHA đó thiếu gate, thay vì lặng lẽ bỏ qua.
          #
          # Phạm vi xác nhận: chỉ khẳng định run ĐÃ ĐƯỢC TẠO, không chờ nó xanh.
          # Chờ xanh sẽ buộc auto-merge treo theo CI và biến kết quả CI thành lỗi
          # của auto-merge. Run đỏ hay bị huỷ vẫn hiện trên main và release gate
          # vẫn từ chối SHA đó — đúng chỗ nó cần bị từ chối.

          # Dùng đúng SHA do merge endpoint trả về, không đọc lại head của main:
          # main có thể đã tiến lên giữa hai bước và khiến job nhận nhầm commit.
          merged_sha="${MERGED_SHA}"
          [[ "${merged_sha}" =~ ^[0-9a-f]{40}$ ]]
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if test "${current_main_sha}" != "${merged_sha}"; then
            echo "main đã tiến từ ${merged_sha} lên ${current_main_sha}; từ chối dispatch validation cho sai SHA." >&2
            exit 1
          fi
          echo "main sau merge: ${merged_sha}"

          for wf in ci.yml production-smoke.yml; do
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/dispatches" \
              -f ref=main

            # Khớp theo ĐÚNG SHA vừa merge, không theo "run mới nhất": một push
            # khác vào main có thể tạo run và làm ta tưởng dispatch đã thành công.
            found=""
            for _ in $(seq 1 30); do
              sleep 5
              found="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?branch=main&head_sha=${merged_sha}&event=workflow_dispatch&per_page=1" \
                --jq '.workflow_runs[0].id // ""')"
              if test -n "${found}"; then
                break
              fi
            done

            if test -z "${found}"; then
              echo "Dispatch ${wf} không tạo run nào cho ${merged_sha} sau 150s." >&2
              echo "GITHUB_TOKEN không kích được workflow_dispatch; commit này thiếu ${wf} trên main và release gate sẽ từ chối nó." >&2
              exit 1
            fi
            echo "${wf}: đã tạo run ${found} trên ${merged_sha}"
          done
