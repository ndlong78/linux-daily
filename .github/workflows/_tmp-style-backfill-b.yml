name: Temporary STYLE Backfill B

on:
  push:
    branches:
      - chatgpt/pr87-style-backfill-011-020

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr87-style-backfill-011-020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run migration
        run: python3 tools/_tmp_style_backfill_b.py
      - name: Commit migrated posts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/post-011-tmux.html \
                  posts/post-012-lap-lich-cron-timers.html \
                  posts/post-013-bash-script-vung.html \
                  posts/post-014-lab-backup-tu-dong.html \
                  posts/post-015-wireguard-vpn.html \
                  posts/post-016-fail2ban.html \
                  posts/post-017-mo-rong-dung-luong.html \
                  posts/post-018-rclone-cloud-sync.html \
                  posts/post-019-triage-hieu-nang-vmstat-iostat.html \
                  posts/post-020-firewall-rollback-negative-test.html
          if git diff --cached --quiet; then
            echo 'No migration changes.'
          else
            git commit -m 'content: backfill STYLE Batch B #011-#020'
            git push
          fi
