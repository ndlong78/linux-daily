name: PR50 Generate Related Navigation

on:
  push:
    branches: [chatgpt/pr50-related-content-series-nav]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr50-related-content-series-nav
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Generate navigation
        run: python tools/related_content.py
      - name: Commit generated post navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: generate related navigation"
          git push origin HEAD:chatgpt/pr50-related-content-series-nav
