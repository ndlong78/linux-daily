name: PR31 Normalize Timeline

on:
  push:
    branches:
      - chatgpt/pr31-normalize-publication-timeline-linux-daily-019

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR31 branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/pr31-normalize-publication-timeline-linux-daily-019
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install -e '.[dev]'

      - name: Normalize historical dates and create #019
        run: python tools/pr31_normalize.py

      - name: Render social code image
        run: |
          python tools/render_code.py \
            --in .pr31-post-019-snippet.txt \
            --out posts/social/post-019-code.png \
            --title 'Linux Daily #019 · Triage CPU / RAM / disk I/O'
          rm -f .pr31-post-019-snippet.txt

      - name: Rebuild index
        run: python tools/build_index.py

      - name: Validate normalized repository
        run: python tools/build.py --check

      - name: Commit normalized timeline and #019
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            posts/post-001-static-ip.html \
            posts/post-002-ssh-hardening.html \
            posts/post-003-zfs-snapshots.html \
            posts/post-004-restic-backup.html \
            posts/post-005-doc-log-journald-syslog.html \
            posts/post-006-ansible-multi-os.html \
            posts/post-007-lab-web-server-tuong-lua.html \
            posts/post-008-chan-doan-mang.html \
            posts/post-009-user-sudo-doas.html \
            posts/post-010-them-dia-moi.html \
            posts/post-011-tmux.html \
            posts/post-012-lap-lich-cron-timers.html \
            posts/post-013-bash-script-vung.html \
            posts/post-014-lab-backup-tu-dong.html \
            posts/post-015-wireguard-vpn.html \
            posts/post-016-fail2ban.html \
            posts/post-017-mo-rong-dung-luong.html \
            posts/post-018-rclone-cloud-sync.html \
            posts/post-019-triage-hieu-nang-vmstat-iostat.html \
            posts/social/post-019-facebook.txt \
            posts/social/post-019-x.txt \
            posts/social/post-019-code.png \
            topics.md state.json index.html
          git diff --cached --check
          git status --short
          git commit -m 'Linux Daily #019: triage CPU RAM and disk I/O'
          git push origin HEAD:chatgpt/pr31-normalize-publication-timeline-linux-daily-019
