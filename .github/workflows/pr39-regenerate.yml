name: PR39 Regenerate Homepage

on:
  push:
    branches: [chatgpt/pr39-website-seo-quality-gate]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr39-website-seo-quality-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python tools/build.py
      - name: Commit generated homepage
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'PR #39: regenerate homepage metadata'
          git push origin HEAD:chatgpt/pr39-website-seo-quality-gate
