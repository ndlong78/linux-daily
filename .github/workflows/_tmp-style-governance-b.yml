name: Temporary STYLE Governance B

on:
  push:
    branches:
      - chatgpt/pr87-style-backfill-011-020

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr87-style-backfill-011-020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch validator tests and audit doc
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/validate_style.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'Historical posts are migrated in batches. Linux Daily #001-#010 have completed\nSTYLE.md backfill and are enforced together with all new posts #041+.',
              'Historical posts are migrated in batches. Linux Daily #001-#020 have completed\nSTYLE.md backfill and are enforced together with all new posts #041+.'
          )
          s = s.replace('BACKFILLED_THROUGH = 10', 'BACKFILLED_THROUGH = 20')
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_validate_style.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_issue_11_remains_legacy_until_batch_b(tmp_path: Path):
              post = tmp_path / "post-011-style-test.html"
              post.write_text(_post(11, valid=False), encoding="utf-8")
              result = validate_style.audit_post(post)
              assert not result.enforced
              assert result.errors
              assert validate_style.check([result]) == 0
          '''
          new = '''def test_batch_b_issue_20_is_enforced(tmp_path: Path):
              post = tmp_path / "post-020-style-test.html"
              post.write_text(_post(20, valid=False), encoding="utf-8")
              result = validate_style.audit_post(post)
              assert result.enforced
              assert any("tested_on" in error for error in result.errors)
              assert validate_style.check([result]) == 1
          '''
          if old not in s:
              raise SystemExit('expected Batch B legacy test block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('docs/STYLE-AUDIT.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Current enforcement: **#001–#010 và #041+**', 'Current enforcement: **#001–#020 và #041+**')
          s = s.replace(
              'PR Batch A đã backfill **#001–#010** theo contract `STYLE.md`. Các bài này không còn được grandfather: `tools/validate_style.py` sẽ fail CI nếu một trong #001–#010 regress.\n\nCác bài **#011–#040** vẫn là legacy migration backlog.',
              'PR Batch A đã backfill **#001–#010** và Batch B backfill **#011–#020** theo contract `STYLE.md`. Các bài #001–#020 không còn được grandfather: `tools/validate_style.py` sẽ fail CI nếu regress.\n\nCác bài **#021–#040** vẫn là legacy migration backlog.'
          )
          s = s.replace('- mặc định: fail CI nếu **#001–#010** hoặc **#041+** vi phạm;', '- mặc định: fail CI nếu **#001–#020** hoặc **#041+** vi phạm;')
          s = s.replace('- **#011–#040** tiếp tục được audit nhưng chưa fail cho tới khi batch tương ứng hoàn tất;', '- **#021–#040** tiếp tục được audit nhưng chưa fail cho tới khi batch tương ứng hoàn tất;')
          s = s.replace('| B | #011–#020 | Chờ | Metadata + step/verification + automation safety |', '| B | #011–#020 | **Hoàn tất trong PR #87** | Metadata + step/verification + automation safety |')
          s = s.replace('Sau Batch B, nâng `BACKFILLED_THROUGH` lên 20; Batch C lên 30; Batch D lên 40.', 'Batch B đã nâng `BACKFILLED_THROUGH` lên 20; Batch C sẽ nâng lên 30; Batch D lên 40.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit governance updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_style.py tests/test_validate_style.py docs/STYLE-AUDIT.md
          if git diff --cached --quiet; then
            echo 'No governance changes.'
          else
            git commit -m 'test(style): enforce Batch B #011-#020'
            git push
          fi
