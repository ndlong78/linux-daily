name: PR37 Historical Backfill

on:
  push:
    branches: [chatgpt/pr37-historical-metadata-link-debt]

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr37-historical-metadata-link-debt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize historical HTML
        run: python tools/backfill_site_metadata.py
      - name: Commit generated HTML
        run: |
          if git diff --quiet -- posts/; then
            echo 'No post changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- posts/post-*.html
          git commit -m 'PR #37: repair historical post document shell'
          git push origin HEAD:chatgpt/pr37-historical-metadata-link-debt
