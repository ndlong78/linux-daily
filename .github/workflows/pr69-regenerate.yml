name: PR69 Regenerate deterministic artifacts

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.number == 69
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr69-p9-3-storage-backup-restore-advanced-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Finalize issue 21 and regenerate artifacts
        run: python tools/pr69_finalize.py
      - name: Commit final source and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize issue 21 deterministic artifacts"
          git push
