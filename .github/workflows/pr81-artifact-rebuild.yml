name: PR81 Artifact Rebuild

on:
  push:
    branches:
      - chatgpt/linux-daily-022-20260722

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/chatgpt/linux-daily-022-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/linux-daily-022-20260722
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependency
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate deterministic artifacts
        run: python tools/publish.py prepare

      - name: Stage only generated artifacts and self-cleanup
        run: |
          git add -- \
            archive.html \
            docs/content-mix-report.md \
            docs/distro-coverage-report.md \
            docs/quality-dashboard.md \
            feed.xml \
            index.html \
            learning-dashboard.html \
            learning-paths.html \
            posts/post-001-static-ip.html \
            posts/post-008-chan-doan-mang.html \
            posts/post-015-wireguard-vpn.html \
            posts/post-022-dns-troubleshooting-dig-resolvectl-drill.html \
            search-index.json \
            sitemap.xml
          git rm -- .github/workflows/pr81-artifact-rebuild.yml .pr81-self-fix-trigger .pr81-self-fix-trigger-2
          git status --short

      - name: Commit generated artifacts and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate PR81 deterministic artifacts"
          git push origin HEAD:chatgpt/linux-daily-022-20260722
