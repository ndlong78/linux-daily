name: PR81 Artifact Rebuild

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  rebuild:
    if: github.event.pull_request.number == 81
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependency
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate deterministic artifacts
        run: python tools/publish.py prepare

      - name: Capture regenerated tree
        run: |
          git status --short
          git diff --name-only > /tmp/regenerated-files.txt
          tar --exclude=.git -czf /tmp/pr81-regenerated-tree.tar.gz .

      - name: Upload regenerated tree
        uses: actions/upload-artifact@v4
        with:
          name: pr81-regenerated-tree
          path: /tmp/pr81-regenerated-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
