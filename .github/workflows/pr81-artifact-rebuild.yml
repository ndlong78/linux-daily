name: PR81 Artifact Rebuild

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  rebuild:
    if: github.event.pull_request.number == 81
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture pre-render git tree
        run: |
          echo "ROOT_TREE=$(git rev-parse HEAD^{tree})"
          git ls-tree HEAD -- \
            archive.html \
            docs/content-mix-report.md \
            docs/distro-coverage-report.md \
            docs/quality-dashboard.md \
            feed.xml \
            index.html \
            learning-dashboard.html \
            learning-paths.html \
            posts/post-001-static-ip.html \
            posts/post-008-chan-doan-mang.html \
            posts/post-015-wireguard-vpn.html \
            posts/post-022-dns-troubleshooting-dig-resolvectl-drill.html \
            search-index.json \
            sitemap.xml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependency
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate deterministic artifacts
        run: python tools/publish.py prepare

      - name: Capture regenerated tree
        run: |
          git status --short
          git diff --name-only > /tmp/regenerated-files.txt
          tar --exclude=.git -czf /tmp/pr81-regenerated-tree.tar.gz .

      - name: Upload regenerated tree
        uses: actions/upload-artifact@v4
        with:
          name: pr81-regenerated-tree
          path: /tmp/pr81-regenerated-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
