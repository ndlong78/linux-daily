name: PR81 Artifact Rebuild

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  rebuild:
    if: github.event.pull_request.number == 81
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependency
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate deterministic artifacts
        run: python tools/publish.py prepare

      - name: Emit exact generated blobs
        run: |
          echo '===POST022_BASE64_BEGIN==='
          base64 -w0 posts/post-022-dns-troubleshooting-dig-resolvectl-drill.html
          echo
          echo '===POST022_BASE64_END==='
          echo '===SEARCH_INDEX_BASE64_BEGIN==='
          base64 -w0 search-index.json
          echo
          echo '===SEARCH_INDEX_BASE64_END==='
          git status --short
