name: PR81 Artifact Rebuild

on:
  push:
    branches:
      - chatgpt/linux-daily-022-20260722

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/chatgpt/linux-daily-022-20260722'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/linux-daily-022-20260722
          fetch-depth: 0

      - name: Verify Actions can write the PR branch
        run: |
          if test -f .pr81-helper-ran; then
            echo "Write probe already completed; no recursive push."
            exit 0
          fi
          printf 'actions branch write probe succeeded\n' > .pr81-helper-ran
          git add -- .pr81-helper-ran
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Probe PR81 Actions branch write"
          git push origin HEAD:chatgpt/linux-daily-022-20260722
