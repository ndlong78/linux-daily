name: Materialize Artifacts

# Dựng artifact dẫn xuất cho branch bài hằng ngày khi agent API-only không có
# Python runtime để tự chạy `tools/publish.py prepare`.
#
# Đây KHÔNG phải finalizer workflow: nó không bao giờ tự chạy theo pull_request
# hay push, chỉ chạy khi được kích hoạt tường minh — cùng khuôn an toàn với
# release.yml. Sau khi push, CI chạy lại trên head SHA mới và Linux Daily Auto
# Merge vẫn kiểm exact-SHA như cũ.
#
# Input `branch` để TRỐNG thì workflow tự tìm branch đích. Điều đó quan trọng:
# GitHub connector của agent không expose verb `workflow_dispatch`, nhưng expose
# `rerun_workflow_job`. Rerun phát lại đúng inputs cũ, nên nếu branch là input bắt
# buộc thì rerun luôn dựng lại branch của hôm trước. Tự tìm branch làm rerun trở
# thành cách kích hoạt hợp lệ cho mọi ngày, mà không cần thêm trigger push/schedule.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch cụ thể; để trống để tự tìm theo state.json"
        required: false
        default: ""
      confirm:
        description: "Type materialize-artifacts to proceed"
        required: true

permissions:
  contents: write
  # Chỉ để mở PR bài hằng ngày ngay sau khi artifact đã dựng xong — xem bước
  # "Mở PR bài hằng ngày" ở cuối. Đặt ở đây chứ không ở một workflow riêng vì
  # workflow này đã chạy từ định nghĩa của `main` và đã biết chính xác branch nó
  # vừa dựng; mọi phương án khác hoặc phải nối `workflow_run` (hành vi chưa đo
  # trong repo này), hoặc phải cấp quyền PR cho workflow đọc định nghĩa từ branch.
  pull-requests: write

jobs:
  # Cổng xác nhận nằm ở bước đầu tiên, KHÔNG phải `if:` mức job. Một job bị skip
  # khiến workflow run vẫn báo thành công, nên gõ sai chuỗi xác nhận sẽ trông như
  # dispatch thành công trong khi không có gì được dựng — kiểu hỏng khó chẩn đoán
  # nhất. Kiểm trong step thì sai chuỗi là fail to và thấy ngay.
  materialize:
    runs-on: ubuntu-latest
    concurrency:
      group: materialize-artifacts
      cancel-in-progress: false

    steps:
      - name: Validate confirm gate
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRM}" = "materialize-artifacts"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Resolve target branch
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "${trusted_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "TRUSTED_SHA=${trusted_sha}" >> "${GITHUB_ENV}"

          if test -n "${INPUT_BRANCH}"; then
            resolved="${INPUT_BRANCH}"
            echo "Branch chỉ định tường minh: ${resolved}"
          else
            # Bài cần dựng luôn là bài kế tiếp so với state.json trên default branch.
            # Không dùng "ahead of main" làm bộ lọc: squash-merge để lại branch cũ
            # ahead vĩnh viễn, nên nó sẽ khớp nhầm branch đã merge.
            last_issue="$(gh api "repos/${GITHUB_REPOSITORY}/contents/state.json" \
              -H "Accept: application/vnd.github.raw" | jq -r '.last_issue')"
            target="$(( last_issue + 1 ))"
            prefix="$(printf 'chatgpt/linux-daily-%03d-' "${target}")"

            mapfile -t found < <(gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate \
              --jq '.[].name' | grep -E "^${prefix}[0-9]{8}$" || true)

            if test "${#found[@]}" -eq 0; then
              echo "Không tìm thấy branch nào cho bài #$(printf '%03d' "${target}") (prefix ${prefix})." >&2
              exit 1
            fi
            if test "${#found[@]}" -gt 1; then
              echo "Có ${#found[@]} branch cho cùng bài #$(printf '%03d' "${target}"); từ chối đoán:" >&2
              printf '  %s\n' "${found[@]}" >&2
              exit 1
            fi
            resolved="${found[0]}"
            echo "state.json.last_issue=${last_issue} → dựng bài #$(printf '%03d' "${target}") trên ${resolved}"
          fi

          [[ "${resolved}" =~ ^chatgpt/linux-daily-[0-9]{3}-[0-9]{8}$ ]]
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${resolved}" --jq '.object.sha')"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
          echo "BRANCH=${resolved}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source against trusted main before executing branch code
        shell: bash
        run: |
          set -euo pipefail
          git show "${TRUSTED_SHA}:tools/materialize_guard.py" > "${RUNNER_TEMP}/materialize_guard.py"
          python3 -I "${RUNNER_TEMP}/materialize_guard.py" --branch "${BRANCH}" --repo-root "${GITHUB_WORKSPACE}" --trusted-ref "${TRUSTED_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Guard branch trước khi ghi
        run: python3 -I "${RUNNER_TEMP}/materialize_guard.py" --branch "${BRANCH}" --repo-root "${GITHUB_WORKSPACE}"

      - name: Materialize deterministic artifacts
        run: python tools/publish.py prepare

      - name: Guard phạm vi thay đổi
        run: python3 -I "${RUNNER_TEMP}/materialize_guard.py" --branch "${BRANCH}" --changed-from-git --repo-root "${GITHUB_WORKSPACE}"

      - name: Verify deterministic publish pipeline
        run: python tools/publish.py check

      - name: Commit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          python3 -I "${RUNNER_TEMP}/materialize_guard.py" --branch "${BRANCH}" --changed-from-git --repo-root "${GITHUB_WORKSPACE}"

          if test -z "$(git status --porcelain)"; then
            echo "Artifact đã đồng bộ; không có gì để commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null

          # AGENTS.md cấm stage cả thư mục: stage đúng từng file đã đổi.
          # --untracked-files=all để thư mục mới không bị gom thành một entry "dir/".
          while IFS= read -r -d '' entry; do
            git add -- "${entry:3}"
          done < <(git status --porcelain -z --untracked-files=all)

          git commit -m "Dựng lại artifact site cho ${BRANCH}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')" = "${TARGET_SHA}"
          gh auth setup-git
          git push origin "HEAD:${BRANCH}"

      # Chạy kể cả khi bước trên `exit 0` vì artifact đã đồng bộ: branch có thể
      # đã dựng đúng từ lượt trước mà vẫn chưa có PR.
      - name: Mở PR bài hằng ngày
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')"
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]

          # Idempotent: materialize chạy lại mỗi lần source được sửa, nhưng PR
          # chỉ được mở một lần. AGENTS.md §2 cấm tạo bản thứ hai cho cùng branch.
          owner="${GITHUB_REPOSITORY%%/*}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${owner}:${BRANCH}&state=open&per_page=1" \
            --jq '.[0].number // ""')"
          if test -n "${existing}"; then
            echo "PR #${existing} đã mở cho ${BRANCH}; không tạo thêm."
            exit 0
          fi

          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}" --jq '.ahead_by')"
          if test "${ahead}" -lt 1; then
            echo "${BRANCH} không có commit nào so với main; không mở PR." >&2
            exit 1
          fi

          # Tiêu đề lấy từ topics.md — định dạng đã được validate_repo gác, và
          # materialize_guard cấm generator chạm vào file này nên nó vẫn đúng
          # bằng nội dung tại TARGET_SHA. Trường tiêu đề có thể chứa dấu `|`
          # (regex của cadence.py cho phép), nên cắt từ field 4 trở đi.
          line="$(grep -E '^#[0-9]+[[:space:]]*\|' topics.md | tail -1)"
          issue="$(cut -d'|' -f1 <<<"${line}" | tr -cd '0-9')"
          subject="$(cut -d'|' -f4- <<<"${line}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test -n "${issue}"
          test -n "${subject}"

          # Non-Draft ngay: linux-daily-auto-merge.yml kiểm `draft=false` tại đúng
          # thời điểm CI hoàn tất, và không có run CI mới nào tự phát sinh sau khi
          # chuyển Ready. Mở Draft ở đây là tự đặt bẫy ordering cho chính mình.
          body="$(printf '%s\n' \
            "Artifact dẫn xuất đã được dựng bởi \`Materialize Artifacts\` (run ${GITHUB_RUN_ID}) trên \`${head_sha}\`." \
            "" \
            "PR này do workflow mở tự động sau khi materialize xanh, theo \`AGENTS.md\` §8." \
            "CI read-only kiểm lại trên đúng head SHA; \`Linux Daily Auto Merge\` squash-merge khi exact-head CI xanh.")"

          pr_number="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f "title=Linux Daily #${issue}: ${subject}" \
            -f "head=${BRANCH}" \
            -f "base=main" \
            -F "draft=false" \
            -f "body=${body}" \
            --jq '.number')"
          echo "Đã mở PR #${pr_number} cho ${BRANCH}."
          echo "PR: https://github.com/${GITHUB_REPOSITORY}/pull/${pr_number}" >> "${GITHUB_STEP_SUMMARY}"

          # Xác nhận PR vừa mở THẬT SỰ kích được CI.
          #
          # Sự kiện do GITHUB_TOKEN sinh ra phần lớn không tạo workflow run; ngoại
          # lệ đã đo được trong repo này là push vào nhánh PR (CI run 709 trên
          # e91e766, `event: pull_request`, 5s sau commit của bot). Nhưng đó là
          # `synchronize`, không phải `opened` — chưa có phép đo nào cho `opened`.
          #
          # Nếu `opened` bị chặn thì toàn bộ chuỗi đứng im: không CI → không
          # workflow_run → auto-merge không bao giờ kích, và PR nằm đó không ai
          # báo. Fail to ở đây biến điều đó thành một run đỏ nhìn thấy được.
          ci_run=""
          for _ in $(seq 1 24); do
            sleep 5
            ci_run="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${BRANCH}&event=pull_request&head_sha=${head_sha}&per_page=1" \
              --jq '.workflow_runs[0].id // ""')"
            if test -n "${ci_run}"; then
              break
            fi
          done

          if test -z "${ci_run}"; then
            echo "PR #${pr_number} đã mở nhưng không có run CI nào (event=pull_request) trên ${head_sha} sau 120s." >&2
            echo "GITHUB_TOKEN không kích được pull_request:opened; PR này cần một push hoặc rerun CI thủ công trước khi auto-merge chạy được." >&2
            exit 1
          fi

          echo "CI đã chạy cho PR #${pr_number}: run ${ci_run}."
