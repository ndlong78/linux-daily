name: Materialize Artifacts

# Dựng artifact dẫn xuất cho branch bài hằng ngày khi agent API-only không có
# Python runtime để tự chạy `tools/publish.py prepare`.
#
# Đây KHÔNG phải finalizer workflow: nó không bao giờ tự chạy theo pull_request
# hay push, chỉ chạy khi được kích hoạt tường minh — cùng khuôn an toàn với
# release.yml. Sau khi push, CI chạy lại trên head SHA mới và Linux Daily Auto
# Merge vẫn kiểm exact-SHA như cũ.
#
# Input `branch` để TRỐNG thì workflow tự tìm branch đích. Điều đó quan trọng:
# GitHub connector của agent không expose verb `workflow_dispatch`, nhưng expose
# `rerun_workflow_job`. Rerun phát lại đúng inputs cũ, nên nếu branch là input bắt
# buộc thì rerun luôn dựng lại branch của hôm trước. Tự tìm branch làm rerun trở
# thành cách kích hoạt hợp lệ cho mọi ngày, mà không cần thêm trigger push/schedule.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch cụ thể; để trống để tự tìm theo state.json"
        required: false
        default: ""
      confirm:
        description: "Type materialize-artifacts to proceed"
        required: true

permissions:
  contents: write

jobs:
  # Cổng xác nhận nằm ở bước đầu tiên, KHÔNG phải `if:` mức job. Một job bị skip
  # khiến workflow run vẫn báo thành công, nên gõ sai chuỗi xác nhận sẽ trông như
  # dispatch thành công trong khi không có gì được dựng — kiểu hỏng khó chẩn đoán
  # nhất. Kiểm trong step thì sai chuỗi là fail to và thấy ngay.
  materialize:
    runs-on: ubuntu-latest
    concurrency:
      group: materialize-artifacts
      cancel-in-progress: false

    steps:
      - name: Validate confirm gate
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRM}" = "materialize-artifacts"

      - name: Resolve target branch
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          if test -n "${INPUT_BRANCH}"; then
            resolved="${INPUT_BRANCH}"
            echo "Branch chỉ định tường minh: ${resolved}"
          else
            # Bài cần dựng luôn là bài kế tiếp so với state.json trên default branch.
            # Không dùng "ahead of main" làm bộ lọc: squash-merge để lại branch cũ
            # ahead vĩnh viễn, nên nó sẽ khớp nhầm branch đã merge.
            last_issue="$(gh api "repos/${GITHUB_REPOSITORY}/contents/state.json" \
              -H "Accept: application/vnd.github.raw" | jq -r '.last_issue')"
            target="$(( last_issue + 1 ))"
            prefix="$(printf 'chatgpt/linux-daily-%03d-' "${target}")"

            mapfile -t found < <(gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate \
              --jq '.[].name' | grep -E "^${prefix}[0-9]{8}$" || true)

            if test "${#found[@]}" -eq 0; then
              echo "Không tìm thấy branch nào cho bài #$(printf '%03d' "${target}") (prefix ${prefix})." >&2
              exit 1
            fi
            if test "${#found[@]}" -gt 1; then
              echo "Có ${#found[@]} branch cho cùng bài #$(printf '%03d' "${target}"); từ chối đoán:" >&2
              printf '  %s\n' "${found[@]}" >&2
              exit 1
            fi
            resolved="${found[0]}"
            echo "state.json.last_issue=${last_issue} → dựng bài #$(printf '%03d' "${target}") trên ${resolved}"
          fi

          [[ "${resolved}" =~ ^chatgpt/linux-daily-[0-9]{3}-[0-9]{8}$ ]]
          echo "BRANCH=${resolved}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài font monospace cho render_code
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Guard branch trước khi ghi
        run: python tools/materialize_guard.py --branch "${BRANCH}"

      - name: Materialize deterministic artifacts
        run: python tools/publish.py prepare

      - name: Guard phạm vi thay đổi
        run: python tools/materialize_guard.py --branch "${BRANCH}" --changed-from-git

      - name: Verify deterministic publish pipeline
        run: python tools/publish.py check

      - name: Commit artifacts
        shell: bash
        run: |
          set -euo pipefail

          if test -z "$(git status --porcelain)"; then
            echo "Artifact đã đồng bộ; không có gì để commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # AGENTS.md cấm stage cả thư mục: stage đúng từng file đã đổi.
          # --untracked-files=all để thư mục mới không bị gom thành một entry "dir/".
          while IFS= read -r -d '' entry; do
            git add -- "${entry:3}"
          done < <(git status --porcelain -z --untracked-files=all)

          git commit -m "Dựng lại artifact site cho ${BRANCH}"
          git push origin "HEAD:${BRANCH}"
