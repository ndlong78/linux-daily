name: Temporary Batch A Content Polish

on:
  push:
    branches:
      - chatgpt/pr85-style-backfill-001-010

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[content-polish]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr85-style-backfill-001-010
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Polish Batch A content
        run: python tools/_tmp_polish_batch_a.py
      - name: Commit polished posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posts/post-001-static-ip.html \
            posts/post-002-ssh-hardening.html \
            posts/post-003-zfs-snapshots.html \
            posts/post-004-restic-backup.html \
            posts/post-005-doc-log-journald-syslog.html \
            posts/post-006-ansible-multi-os.html \
            posts/post-007-lab-web-server-tuong-lua.html \
            posts/post-008-chan-doan-mang.html \
            posts/post-009-user-sudo-doas.html \
            posts/post-010-them-dia-moi.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "polish(content): make Batch A article-specific [content-polish]"
          git push origin HEAD:chatgpt/pr85-style-backfill-001-010
